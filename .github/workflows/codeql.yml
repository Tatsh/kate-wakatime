env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: "${{ matrix.language == 'c-cpp' }}"
        name: 'Install dependencies'
        run: |
          curl -s http://archive.neon.kde.org/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/neon-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/neon-archive-keyring.gpg] http://archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/neon.list > /dev/null
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install -y kf6-ktexteditor-dev extra-cmake-modules
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63'
        with:
          languages: '${{ matrix.language }}'
      - name: 'Autobuild'
        uses: 'github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63'
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'c-cpp'
          - 'actions'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '15 4 * * 3'
