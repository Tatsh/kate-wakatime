concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: "${{ matrix.language == 'c-cpp' }}"
        name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y extra-cmake-modules libkf6texteditor-dev
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066'
        with:
          languages: '${{ matrix.language }}'
      - name: 'Autobuild'
        uses: 'github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066'
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066'
        with:
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
          category: '/language:${{matrix.language}}'
      - if: matrix.language == 'c-cpp' || matrix.language == 'cpp'
        name: Restrict native findings to project sources
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:${{matrix.language}}
          sarif_file: ${{ runner.temp }}/codeql-sarif
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'c-cpp'
          - 'actions'
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/action.yaml'
      - '**/action.yml'
      - '.github/workflows/*.yaml'
      - '.github/workflows/*.yml'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
