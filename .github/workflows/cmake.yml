jobs:
  build-msys:
    runs-on: 'windows-latest'
    steps:
      - id: 'fixed_workspace'
        name: 'Fix path'
        run: |
          "out=$($env:GITHUB_WORKSPACE -replace '\\', '/')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: 'msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884'
        with:
          msystem: '${{ matrix.sys }}'
          pacboy: >-
            cmake:p
            extra-cmake-modules:p
            kcompletion:p
            ki18n:p
            kparts:p
            ktexteditor:p
            kwidgetsaddons:p
            kxmlgui:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-tools:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Configure'
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
        shell: 'msys2 {0}'
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Build'
        run: 'cmake --build "$WORKSPACE/build" --verbose'
        shell: 'msys2 {0}'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Install'
        run: >-
          cmake --install "$WORKSPACE/build"
          --config "$BUILD_TYPE" --verbose
        shell: 'msys2 {0}'
      - name: 'Upload install prefix'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'kate-wakatime-${{ matrix.sys }}-${{ matrix.build-type }}'
          path: '${{ steps.fixed_workspace.outputs.out }}/build/prefix'
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - 'Debug'
          - 'Release'
        sys:
          - 'clang64'
          - 'ucrt64'
name: 'Build'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'
permissions:
  contents: 'read'
