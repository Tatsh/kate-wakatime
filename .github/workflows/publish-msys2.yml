jobs:
  check:
    if: "github.event.workflow_run.conclusion == 'success'"
    outputs:
      tag: '${{ steps.release.outputs.tag }}'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
        id: 'release'
        name: 'Find the published release for this commit'
        run: |
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${REPO}/git/tags/${obj_sha}" \
                --jq '.object.sha' 2>/dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag points at ${HEAD_SHA}, nothing to do."
            exit 0
          fi
          unpublished=$(gh release view "$tag" --repo "$REPO" --json isDraft,isPrerelease \
            --jq '.isDraft or .isPrerelease' 2>/dev/null || echo 'true')
          if [[ "$unpublished" != 'false' ]]; then
            echo "Release ${tag} is not published, nothing to do."
            exit 0
          fi
          echo "Found published release ${tag}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
  update-pkgbuild:
    if: "needs.check.outputs.tag != ''"
    needs:
      - 'check'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          TAG_NAME: '${{ needs.check.outputs.tag }}'
        id: 'version'
        name: 'Extract version'
        run: |
          TAG="$TAG_NAME"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 'Checkout MINGW-packages repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
          repository: 'msys2/MINGW-packages'
          token: '${{ secrets.MSYS2_TOKEN }}'
      - name: 'Configure git'
        run: |
          git config user.name "Andrew Udvare"
          git config user.email "audvare@gmail.com"
      - env:
          VERSION: '${{ steps.version.outputs.version }}'
        name: 'Update PKGBUILD'
        run: |
          git remote add upstream https://github.com/msys2/MINGW-packages.git
          git fetch upstream
          git checkout master
          git reset --hard upstream/master
          cd mingw-w64-kate-wakatime
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          NEW_SUM=$(curl -L "https://github.com/Tatsh/kate-wakatime/archive/refs/tags/v${VERSION}.tar.gz" | sha256sum | awk '{print $1}')
          sed -i "s/^sha256sums=.*/sha256sums=('${NEW_SUM}')/" PKGBUILD
      - name: 'Create Pull Request'
        uses: 'peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1'
        with:
          base: 'master'
          body: |
            This PR was automatically created from the [kate-wakatime ${{ steps.version.outputs.tag }} release](https://github.com/Tatsh/kate-wakatime/releases/tag/${{ steps.version.outputs.tag }}).
          branch: 'kate-wakatime-${{ steps.version.outputs.version }}'
          commit-message: 'mingw-w64-kate-wakatime: update to ${{ steps.version.outputs.version }}'
          push-to-fork: 'Tatsh/MINGW-packages'
          title: 'mingw-w64-kate-wakatime: update to ${{ steps.version.outputs.version }}'
          token: '${{ secrets.MSYS2_TOKEN }}'
name: 'Update MSYS2 PKGBUILD'
'on':
  workflow_run:
    types:
      - 'completed'
    workflows:
      - 'Release'
permissions:
  contents: 'read'
