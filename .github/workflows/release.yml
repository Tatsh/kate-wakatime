concurrency:
  cancel-in-progress: false
  group: 'release-${{ github.event.workflow_run.head_sha }}'
jobs:
  publish-release:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
          TRIGGER_CONCLUSION: '${{ github.event.workflow_run.conclusion }}'
        id: 'guard'
        name: 'Check trigger conditions'
        run: |
          if [[ "$TRIGGER_CONCLUSION" != 'success' ]]; then
            echo "Triggering workflow concluded with '${TRIGGER_CONCLUSION}', nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${REPO}/git/tags/${obj_sha}" \
                --jq '.object.sha' 2>/dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag points at ${HEAD_SHA}, nothing to do."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found release tag ${tag} for SHA ${HEAD_SHA}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
          TAG: '${{ steps.guard.outputs.tag }}'
        id: 'check'
        if: "steps.guard.outputs.proceed == 'true'"
        name: 'Check all required workflows succeeded'
        run: |
          all_success=true
          for entry in 'Build:required' 'CodeQL:optional' 'Prettier:optional' 'QA:optional' \
                       'Spelling:optional' 'Tests:optional' 'clang-format:optional' \
                       'markdownlint:optional'; do
            workflow="${entry%:*}"
            requirement="${entry##*:}"
            run=$(gh run list --repo "$REPO" --workflow "$workflow" --commit "$HEAD_SHA" \
              --json status,conclusion --limit 1 --jq '.[0]')
            if [[ -z "$run" || "$run" == 'null' ]]; then
              if [[ "$requirement" == 'required' ]]; then
                echo "::error::Required workflow '${workflow}' did not run for ${HEAD_SHA}."
                exit 1
              fi
              echo "Workflow '${workflow}' did not run for this commit; treating as optional."
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '${workflow}' ${conclusion}."
                exit 1
                ;;
              skipped|neutral)
                if [[ "$requirement" == 'required' ]]; then
                  echo "::error::Required workflow '${workflow}' was ${conclusion}."
                  exit 1
                fi
                ;;
              success)
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '${workflow}' completed with unexpected" \
                    "conclusion '${conclusion}'."
                  exit 1
                fi
                echo "Workflow '${workflow}' still pending (status=${status})."
                all_success=false
                ;;
            esac
          done
          if [[ "$all_success" != 'true' ]]; then
            echo 'Not all workflows have completed yet.'
            exit 0
          fi
          echo "All required workflows succeeded for ${TAG}."
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          TAG: '${{ steps.guard.outputs.tag }}'
        if: "steps.check.outputs.ready == 'true'"
        name: 'Publish release'
        run: |
          if ! gh release view --repo "$REPO" "$TAG" --json isDraft > /dev/null 2>&1; then
            echo "::error::No GitHub Release exists for ${TAG}; refusing to publish."
            exit 1
          fi
          if [[ "$(gh release view --repo "$REPO" "$TAG" --json isDraft --jq '.isDraft')" \
                != 'true' ]]; then
            echo "Release ${TAG} is already published; nothing to do."
            exit 0
          fi
          gh release edit --repo "$REPO" "$TAG" --draft=false
          if [[ "$(gh release view --repo "$REPO" "$TAG" --json isDraft --jq '.isDraft')" \
                != 'false' ]]; then
            echo "::error::Release ${TAG} is still a draft after publishing."
            exit 1
          fi
          echo "Published ${TAG}."
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        if: 'always()'
        name: 'Delete prior non-publishing Release runs'
        run: |
          delete_run() {
            local id="$1" reason="$2"
            echo "Deleting prior Release run ${id} (${reason})."
            gh run delete --repo "$REPO" "$id" || true
          }
          published_step_skipped() {
            local id="$1"
            local step_conclusion
            step_conclusion=$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
              --jq '[.jobs[].steps[] | select(.name == "Publish release")][0].conclusion' 2>/dev/null || echo '')
            [[ "$step_conclusion" == 'skipped' ]]
          }
          gh run list --repo "$REPO" --workflow 'Release' \
            --json databaseId,status,conclusion --limit 100 \
            | jq -r --arg self "$RUN_ID" \
                '.[] | select((.databaseId|tostring) != $self) | select(.status == "completed") | [.databaseId, .conclusion] | @tsv' \
            | while IFS=$'\t' read -r id conclusion; do
                [[ -z "$id" ]] && continue
                case "$conclusion" in
                  skipped|cancelled|neutral)
                    delete_run "$id" "$conclusion"
                    ;;
                  success)
                    if published_step_skipped "$id"; then
                      delete_run "$id" 'success without publish'
                    fi
                    ;;
                esac
              done
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        if: "steps.guard.outputs.proceed != 'true' || steps.check.outputs.ready != 'true'"
        name: 'Cancel this run so it can be cleaned up'
        run: |
          echo 'This run did not publish; cancelling so a later run can remove it.'
          gh run cancel --repo "$REPO" "$RUN_ID" || true
          sleep 30
name: 'Release'
'on':
  workflow_run:
    types:
      - 'completed'
    workflows:
      - 'Build'
      - 'CodeQL'
      - 'Prettier'
      - 'QA'
      - 'Spelling'
      - 'Tests'
      - 'clang-format'
      - 'markdownlint'
permissions:
  actions: 'write'
  contents: 'write'
